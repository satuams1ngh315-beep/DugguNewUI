name: Build & Release APK

# Runs automatically when pushing to arena/main/master branches.
# Creates a real GitHub Release with the APK as a downloadable asset.

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
      - 'master'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          validate-wrappers: false

      - name: Create local.properties
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" >> local.properties

      - name: Set up release signing
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          mkdir -p keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/duggustore-release.jks
          echo "RELEASE_STORE_FILE=keystore/duggustore-release.jks" >> local.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> local.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> local.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> local.properties

      - name: Read version info
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          BUILD_NUM=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "1")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD_NUM" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: set -o pipefail; ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build-debug.log

      - name: Build Release APK
        run: set -o pipefail; ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report build errors
        if: failure()
        run: |
          for f in /tmp/build-debug.log /tmp/build.log; do
            [ -f "$f" ] || continue
            grep -nE "^e: |error:|FAILED|FAILURE|What went wrong|Execution failed|Caused by:|Could not|Unable to" "$f" \
              | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
          done

      - name: Rename APKs
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk \
             release-assets/DugguStore-v${{ steps.version.outputs.version }}-debug.apk
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" release-assets/DugguStore-v${{ steps.version.outputs.version }}-release.apk
          done
          ls -lh release-assets/

      - name: Build Release Bundle (AAB)
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: ./gradlew bundleRelease --stacktrace

      - name: Copy AAB
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        run: |
          cp app/build/outputs/bundle/release/app-release.aab \
             release-assets/DugguStore-v${{ steps.version.outputs.version }}-release.aab

      - name: Upload Debug APK artifact
        # See build.yml: a full artifact quota must not fail the build, and
        # more importantly must not stop the step below it — the Release
        # assets are what the APK is actually downloaded from.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: DugguStore-debug-v${{ steps.version.outputs.version }}
          path: release-assets/*-debug.apk
          retention-days: 14

      - name: Upload Release APK artifact
        # See build.yml: a full artifact quota must not fail the build, and
        # more importantly must not stop the step below it — the Release
        # assets are what the APK is actually downloaded from.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: DugguStore-release-v${{ steps.version.outputs.version }}
          path: release-assets/*-release.apk
          retention-days: 14

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log $PREV_TAG..HEAD --oneline --no-merges | head -30)
          else
            LOG=$(git log --oneline --no-merges -30)
          fi
          echo "log<<CHANGELOG" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "CHANGELOG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build-${{ steps.version.outputs.build }}
          name: "DugguStore v${{ steps.version.outputs.version }} (Build ${{ steps.version.outputs.build }})"
          body: |
            ## 🚀 DugguStore Android App

            **Version:** ${{ steps.version.outputs.version }}
            **Build:** ${{ steps.version.outputs.build }}
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`

            ###  Download APK

            | Build | File |
            |-------|------|
            |  Debug | `DugguStore-v${{ steps.version.outputs.version }}-debug.apk` |
            | 🟢 Release | `DugguStore-v${{ steps.version.outputs.version }}-release.apk` |

            ### 📝 Recent Changes
            ```
            ${{ steps.changelog.outputs.log }}
            ```

            ### ✨ What's New
            - Premium Blinkit-style UI redesign
            - Gold-to-orange gradient header
            - Beautiful category tiles with actual images
            - Premium product cards with soft shadows
            - Animated bottom navigation with gradient indicator
            - Green ADD buttons with quantity stepper
            - Orange discount badges with premium typography
            - Much more!

            ---
            *Auto-built by GitHub Actions* 🤖
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
